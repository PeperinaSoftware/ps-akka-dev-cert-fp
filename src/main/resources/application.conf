akka.http.cors {
  allowed-origins = ["*"]
  allowed-headers = ["Content-Type", "Authorization"]
}
 
akka.javasdk.agent {
  model-provider = googleai-gemini
}

akka.javasdk.agent.googleai-gemini {
  provider = "googleai-gemini"
  api-key = ""
  api-key = ${?GOOGLE_AI_GEMINI_API_KEY}
  model-name = "gemini-2.5-flash"
  max-retries = 0
  thinking-budget = "none"
}

flight-agent {
    # OpenWeatherMap Current Weather API — use env OPENWEATHERMAP_API_KEY
    api-key = ""
    api-key = ${?OPENWEATHERMAP_API_KEY}
    conditions-cache-ttl-seconds = 60
    # When true and Gemini returns 429/quota errors, the workflow can use a synthetic approval
    # path that is explicitly labeled in logs (see BookingWorkflow). For real weather/agent checks,
    # set false or export ALLOW_SIMULATED_QUOTA_FALLBACK=false.
    allow-simulated-quota-fallback = true
    allow-simulated-quota-fallback = ${?ALLOW_SIMULATED_QUOTA_FALLBACK}

    base-url = "https://api.openweathermap.org/data/2.5/weather"
    base-url = ${?OPENWEATHER_BASE_URL}

    # Passed as OpenWeather "q=" (city,country per their docs)
    location-query = "Cordoba,AR"
    location-query = ${?OPENWEATHER_LOCATION_QUERY}

    # Agent + OpenWeather can exceed the SDK default workflow step timeout (5s).
    booking-workflow-step-timeout = 120s

    # Max wall-clock wait for all three ReservationEntity participant requests (accept/reject)
    # to be processed by consumers before the workflow fails with "request evaluation timeout".
    reservation-participant-evaluation-deadline = 90s
    reservation-participant-evaluation-deadline = ${?RESERVATION_EVALUATION_DEADLINE}
}